# Development-only configuration
# Redirects /js and /css requests to /dist/js and /dist/css
# This file is only mounted in docker-compose for local development

server {
    listen *:80;
    server_name _;

    location ~* ^/js/(.+)$ {
		return 302 $scheme://$http_host/static/dist/js/$1;
	}

    # Does not affect the enginecore.js file
    location ~* ^/(js|css)/(.+)$ {
        return 301 /dist/$1/$2;
    }
}
