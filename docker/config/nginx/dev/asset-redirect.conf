# Development-only configuration
# Redirects /js and /css requests to /dist/js and /dist/css
# This file is only mounted in docker-compose for local development

server {
    listen *:80;
    server_name _;

    location ~* ^/(js|css)/(.+)$ {
        return 301 /static/dist/$1/$2;
    }
    location ~* ^/js/(.+)$ {
        return 302 /static/dist/js/$1;
    }
    location ~* ^/css/(.+)$ {
        return 302 /static/dist/css/$1;
    }
}
